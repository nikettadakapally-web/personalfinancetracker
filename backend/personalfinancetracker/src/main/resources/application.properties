spring.application.name=wealth-expense-intelligence
server.port=${PORT:${SERVER_PORT:8081}}
server.address=${SERVER_ADDRESS:0.0.0.0}

# File-backed H2 keeps accounts and payment requests when the backend restarts.
spring.datasource.url=jdbc:h2:file:${DB_FILE:./data/financedb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.jpa.hibernate.ddl-auto=update
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Configure these environment variables on the backend to enable email requests.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# If using MySQL instead, comment above and uncomment below:
# spring.datasource.url=jdbc:mysql://localhost:3306/financedb?createDatabaseIfNotExist=true&useSSL=false
