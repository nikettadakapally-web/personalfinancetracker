services:
  - type: web
    name: finance-expense-api
    runtime: docker
    plan: starter
    rootDir: backend/personalfinancetracker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DB_FILE
        value: /var/data/financedb
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
    disk:
      name: finance-data
      mountPath: /var/data
      sizeGB: 1
