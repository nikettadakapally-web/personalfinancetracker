services:
  - type: web
    name: wealth-expense-intelligence
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./backend/personalfinancetracker/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DB_FILE
        value: /tmp/financedb
      - key: H2_CONSOLE_ENABLED
        value: "false"
